services:
  mongo:
    image: mongo:7
    container_name: ticket-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
    volumes:
      # ဒီနေရာမှာ Desktop လမ်းကြောင်းကို ထည့်ပေးလိုက်ပါ
      - ~/Desktop/my_mongo_data:/data/db

